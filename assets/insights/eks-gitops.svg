<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Amazon EKS GitOps delivery insight</title>
  <desc id="desc">A visual showing GitHub Actions building and scanning an image, ECR storing it, ArgoCD reconciling Git and Amazon EKS running the Kubernetes workload.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08292b"/><stop offset="1" stop-color="#0c3739"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#d9efea" stroke-opacity=".035"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="620" rx="30" fill="url(#bg)"/>
  <rect width="1200" height="620" rx="30" fill="url(#grid)"/>
  <rect x="44" y="42" width="1112" height="536" rx="22" fill="#061f21" stroke="#b9d9d3" stroke-opacity=".16"/>
  <circle cx="76" cy="74" r="6" fill="#ef6a5b"/><circle cx="96" cy="74" r="6" fill="#e9a648"/><circle cx="116" cy="74" r="6" fill="#75d6c0"/>
  <text x="142" y="80" fill="#8faeaa" font-family="system-ui,sans-serif" font-size="15" font-weight="700" letter-spacing="1.8">GITOPS DELIVERY / EKS</text>
  <text x="76" y="142" fill="#fbf6ed" font-family="system-ui,sans-serif" font-size="25" font-weight="800">Release flow</text>
  <text x="76" y="171" fill="#8faeaa" font-family="system-ui,sans-serif" font-size="14">Build, scan, publish, reconcile.</text>
  <g font-family="system-ui,sans-serif" text-anchor="middle">
    <g><rect x="74" y="222" width="190" height="84" rx="16" fill="#0e3f41" stroke="#76d6c0" stroke-opacity=".45"/><text x="169" y="255" fill="#fbf6ed" font-size="16" font-weight="800">GitHub Actions</text><text x="169" y="280" fill="#8faeaa" font-size="12">build + Trivy scan</text></g>
    <path d="M278 264H352" stroke="#ea9239" stroke-width="2" stroke-linecap="round"/><circle cx="315" cy="264" r="5" fill="#ea9239" filter="url(#glow)"/><path d="m345 257 9 7-9 7" fill="none" stroke="#ea9239" stroke-width="2"/>
    <g><rect x="366" y="222" width="150" height="84" rx="16" fill="#0e3f41" stroke="#b9d9d3" stroke-opacity=".28"/><text x="441" y="255" fill="#fbf6ed" font-size="16" font-weight="800">Amazon ECR</text><text x="441" y="280" fill="#8faeaa" font-size="12">SHA-tagged image</text></g>
    <path d="M530 264H604" stroke="#ea9239" stroke-width="2" stroke-linecap="round"/><circle cx="567" cy="264" r="5" fill="#ea9239"/><path d="m597 257 9 7-9 7" fill="none" stroke="#ea9239" stroke-width="2"/>
    <g><rect x="618" y="222" width="150" height="84" rx="16" fill="#0e3f41" stroke="#b9d9d3" stroke-opacity=".28"/><text x="693" y="255" fill="#fbf6ed" font-size="16" font-weight="800">ArgoCD</text><text x="693" y="280" fill="#8faeaa" font-size="12">reconcile from Git</text></g>
    <path d="M782 264H856" stroke="#ea9239" stroke-width="2" stroke-linecap="round"/><circle cx="819" cy="264" r="5" fill="#ea9239"/><path d="m849 257 9 7-9 7" fill="none" stroke="#ea9239" stroke-width="2"/>
    <g><rect x="870" y="204" width="234" height="120" rx="18" fill="#123f42" stroke="#76d6c0" stroke-opacity=".52"/><text x="987" y="242" fill="#fbf6ed" font-size="17" font-weight="800">Amazon EKS</text><rect x="902" y="265" width="78" height="32" rx="9" fill="#072b2d" stroke="#76d6c0" stroke-opacity=".3"/><rect x="993" y="265" width="78" height="32" rx="9" fill="#072b2d" stroke="#76d6c0" stroke-opacity=".3"/><text x="941" y="286" fill="#c7d6d3" font-size="11">2048 pod</text><text x="1032" y="286" fill="#c7d6d3" font-size="11">2048 pod</text></g>
  </g>
  <g font-family="system-ui,sans-serif">
    <rect x="74" y="374" width="1030" height="136" rx="18" fill="#092d2f" stroke="#b9d9d3" stroke-opacity=".12"/>
    <text x="100" y="410" fill="#ea9239" font-size="12" font-weight="800" letter-spacing="1.6">CURRENT STATE</text>
    <circle cx="104" cy="446" r="6" fill="#76d6c0" filter="url(#glow)"/><text x="124" y="451" fill="#fbf6ed" font-size="14" font-weight="700">ArgoCD synced</text>
    <circle cx="316" cy="446" r="6" fill="#76d6c0"/><text x="336" y="451" fill="#fbf6ed" font-size="14" font-weight="700">2/2 workloads healthy</text>
    <circle cx="590" cy="446" r="6" fill="#76d6c0"/><text x="610" y="451" fill="#fbf6ed" font-size="14" font-weight="700">OIDC authentication</text>
    <circle cx="842" cy="446" r="6" fill="#76d6c0"/><text x="862" y="451" fill="#fbf6ed" font-size="14" font-weight="700">Monitoring active</text>
    <text x="100" y="486" fill="#8faeaa" font-size="12">Git remains the deployment source of truth; the CI pipeline updates the image reference and ArgoCD handles cluster reconciliation.</text>
  </g>
</svg>