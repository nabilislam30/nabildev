<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Global DevOps delivery map</title>
  <desc id="desc">A flat world map with glowing delivery routes connecting engineering regions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d141e"/>
      <stop offset="1" stop-color="#070b11"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ff7a1a" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#ff9b52"/>
      <stop offset="1" stop-color="#52d6b0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#34404f"/>
    </pattern>
    <clipPath id="landClip">
      <path d="M88 225l46-52 79-28 74 15 50 42 45 6 41 42-18 40-46 15-25 45-50 10-27 49-47-11-18-47-43-22-44-58z"/>
      <path d="M313 401l55 7 38 42 18 62-13 68-40 66-29-15-19-60-35-35-17-57 16-42z"/>
      <path d="M528 202l51-29 72 3 45 24 56-8 51 23 49-1 63 35 66 5 56 39-18 35-51-3-36 31-56-10-35 27-66-5-44-35-58-2-39-41-52 5-31-27-41 3-17-36z"/>
      <path d="M650 365l70 8 40 38 4 62-37 66-50 33-31-52-23-57 9-54z"/>
      <path d="M934 468l44-26 66 10 44 42-23 43-58 17-55-23-38-32z"/>
      <path d="M1016 191l29-22 31 8 15 27-22 18-40-4z"/>
    </clipPath>
  </defs>
  <rect width="1200" height="720" rx="34" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="718" rx="33" fill="none" stroke="#283241"/>
  <g opacity=".45">
    <path d="M0 120h1200M0 240h1200M0 360h1200M0 480h1200M0 600h1200" stroke="#18212d"/>
    <path d="M150 0v720M300 0v720M450 0v720M600 0v720M750 0v720M900 0v720M1050 0v720" stroke="#18212d"/>
  </g>
  <g clip-path="url(#landClip)">
    <rect x="40" y="120" width="1100" height="540" fill="url(#dots)"/>
    <rect x="40" y="120" width="1100" height="540" fill="#1d2734" opacity=".3"/>
  </g>
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M247 282 Q470 95 650 280" stroke="url(#route)" stroke-width="3.2"/>
    <path d="M650 280 Q815 132 970 286" stroke="url(#route)" stroke-width="3.2"/>
    <path d="M650 280 Q588 420 710 465" stroke="url(#route)" stroke-width="3.2"/>
    <path d="M247 282 Q365 398 360 500" stroke="url(#route)" stroke-width="3.2"/>
    <path d="M710 465 Q890 435 1018 500" stroke="url(#route)" stroke-width="3.2"/>
  </g>
  <g>
    <circle cx="247" cy="282" r="6" fill="#ff7a1a"/><circle cx="247" cy="282" r="15" fill="none" stroke="#ff7a1a" opacity=".25"/>
    <circle cx="650" cy="280" r="7" fill="#ff9b52"/><circle cx="650" cy="280" r="18" fill="none" stroke="#ff9b52" opacity=".3"/>
    <circle cx="970" cy="286" r="6" fill="#52d6b0"/><circle cx="970" cy="286" r="15" fill="none" stroke="#52d6b0" opacity=".25"/>
    <circle cx="360" cy="500" r="5" fill="#ff7a1a"/><circle cx="710" cy="465" r="5" fill="#52d6b0"/><circle cx="1018" cy="500" r="5" fill="#ff9b52"/>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="72" y="80" fill="#f4f7fb" font-size="24" font-weight="700">Global delivery infrastructure</text>
    <text x="72" y="112" fill="#7f8a99" font-size="15">Automated systems. Distributed services. Observable outcomes.</text>
    <g fill="#6f7a89" font-size="14" font-family="ui-monospace,Consolas,monospace">
      <text x="820" y="620">$ terraform apply</text>
      <text x="820" y="648">$ kubectl rollout status</text>
      <text x="820" y="676">$ deploy --region global</text>
    </g>
  </g>
</svg>
