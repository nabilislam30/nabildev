NI</text><text x="220" y="425" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#2f6fed">Pod networking</text><text class="t sm" x="220" y="458" text-anchor="middle">Assigns VPC IPs to pods</text><rect class="purple" x="360" y="290" width="220" height="195" rx="8"/><text x="470" y="350" text-anchor="middle" font-size="42" fill="#7a4de8">DNS</text><text class="t h" x="470" y="392" text-anchor="middle" font-size="24">CoreDNS</text><text x="470" y="425" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#2f6fed">DNS &amp; discovery</text><text class="t sm" x="470" y="458" text-anchor="middle">Resolves service names</text><rect class="blue" x="610" y="290" width="220" height="195" rx="8"/><text x="720" y="350" text-anchor="middle" font-size="42" fill="#2f6fed">↔</text><text class="t h" x="720" y="392" text-anchor="middle" font-size="24">kube-proxy</text><text x="720" y="425" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#2f6fed">Service networking</text><text class="t sm" x="720" y="458" text-anchor="middle">Routes traffic to pods</text><rect class="green" x="860" y="290" width="220" height="195" rx="8"/><text x="970" y="350" text-anchor="middle" font-size="42" fill="#35a853">◉</text><text class="t h" x="970" y="392" text-anchor="middle" font-size="24">EBS CSI Driver</text><text x="970" y="425" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#2f6fed">Persistent storage</text><text class="t sm" x="970" y="458" text-anchor="middle">Manages EBS volumes</text><path d="M220 485 C220 560 430 535 520 590" fill="none" stroke="#7a4de8" stroke-width="3"/><path d="M470 485 C470 555 500 555 555 590" fill="none" stroke="#7a4de8" stroke-width="3"/><path d="M720 485 C720 555 670 555 625 590" fill="none" stroke="#2f6fed" stroke-width="3"/><path d="M970 485 C970 560 810 545 690 590" fill="none" stroke="#35a853" stroke-width="3"/><rect class="orange" x="445" y="57