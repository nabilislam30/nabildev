<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="#fff"/>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b1f3a" flood-opacity=".12"/></filter><style>.t{font-family:Arial,Helvetica,sans-serif;fill:#0b1f3a}.h{font-weight:700}.s{font-size:20px}.sm{font-size:16px}.xs{font-size:13px}.box{fill:#fff;stroke:#b9c9de;stroke-width:2}.blue{fill:#eff6ff;stroke:#2f6fed;stroke-width:2}.green{fill:#f1fbf4;stroke:#35a853;stroke-width:2}.orange{fill:#fff5eb;stroke:#ff9900;stroke-width:2}.purple{fill:#f7f2ff;stroke:#7a4de8;stroke-width:2}.dash{fill:none;stroke:#79a7d8;stroke-width:2;stroke-dasharray:7 6}.arrow{stroke:#0b1f3a;stroke-width:3;fill:none;marker-end:url(#arr)}</style><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b1f3a"/></marker></defs>
<text class="t h" x="90" y="70" font-size="44">aws</text><text class="t h" x="210" y="70" font-size="42">EKS Identity Flow</text><text class="t s" x="210" y="105">How AWS IAM becomes Kubernetes access in Amazon EKS</text>
<rect class="box" x="30" y="155" width="220" height="420" rx="8"/><text class="t h" x="55" y="205" font-size="26">Human / CI</text><text x="140" y="320" text-anchor="middle" font-size="78" fill="#0b1f3a">♙</text><text class="t h s" x="140" y="410" text-anchor="middle">Developer or CI/CD</text><text class="t sm" x="140" y="455" text-anchor="middle">Uses AWS credentials</text><text class="t sm" x="140" y="478" text-anchor="middle">to access the cluster</text>
<rect x="285" y="155" width="260" height="420" rx="8" fill="#fff1f2" stroke="#e63946" stroke-width="3"/><text class="t h" x="330" y="205" font-size="28">AWS IAM</text><rect x="330" y="245" width="82" height="82" rx="8" fill="#e63946"/><text x="371" y="296" text-anchor="middle" font-size="28" font-weight="700" fill="white">IAM</text><text class="t h s" x="415" y="380" text-anchor="middle">AWS IAM Identity</text><text class="t sm" x="415" y="410" text-anchor="middle">User or role</text><text class="t sm" x="415" y="465" text-anchor="middle">Authenticates with AWS</text><text class="t sm" x="415" y="488" text-anchor="middle">using IAM credentials</text>
<rect x="585" y="155" width="305" height="420" rx="8" fill="#fff6ec" stroke="#ff9900" stroke-width="3"/><text class="t h" x="630" y="205" font-size="28">Amazon EKS</text><rect class="box" x="620" y="245" width="235" height="120" rx="8"/><text class="t h s" x="650" y="285">Access entry</text><text class="t sm" x="650" y="315">Maps IAM identity</text><text class="t sm" x="650" y="340">to the cluster</text><rect class="box" x="620" y="400" width="235" height="120" rx="8"/><text class="t h s" x="650" y="440">EKS access policy</text><text class="t sm" x="650" y="470">or Kubernetes groups</text><text class="t sm" x="650" y="495">Define cluster permissions</text>
<rect x="930" y="155" width="240" height="420" rx="8" fill="#eef5ff" stroke="#2f6fed" stroke-width="3"/><text class="t h" x="970" y="205" font-size="28">Kubernetes</text><rect class="box" x="960" y="260" width="180" height="155" rx="8"/><text x="1050" y="325" text-anchor="middle" font-size="50" fill="#2f6fed">☸</text><text class="t h s" x="1050" y="365" text-anchor="middle">RBAC</text><text class="t sm" x="1050" y="392" text-anchor="middle">roles and bindings</text><text class="t sm" x="1050" y="465" text-anchor="middle">Controls what the identity</text><text class="t sm" x="1050" y="488" text-anchor="middle">can do in the cluster</text><path class="arrow" d="M250 355 H285"/><path class="arrow" d="M545 355 H585"/><path class="arrow" d="M890 355 H930"/>
<rect x="30" y="625" width="1140" height="160" rx="8" fill="#fafafa" stroke="#8aa0bd" stroke-width="2" stroke-dasharray="8 6"/><text class="t h" x="65" y="665" font-size="25">Other identities in EKS</text><rect class="green" x="65" y="690" width="490" height="70" rx="8"/><text class="t h s" x="105" y="722">EKS service — Cluster role</text><text class="t sm" x="105" y="747">Assumed by EKS to manage the control plane</text><rect class="purple" x="610" y="690" width="520" height="70" rx="8"/><text class="t h s" x="650" y="722">EC2 worker nodes — Node role</text><text class="t sm" x="650" y="747">Used by nodes for AWS access</text></svg>