<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<rect width="1200" height="820" fill="#fff"/>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0b1f3a" flood-opacity=".12"/></filter>
  <style>.t{font-family:Arial,Helvetica,sans-serif;fill:#0b1f3a}.h{font-weight:700}.s{font-size:20px}.sm{font-size:16px}.xs{font-size:13px}.box{fill:#fff;stroke:#b9c9de;stroke-width:2}.blue{fill:#eff6ff;stroke:#2f6fed;stroke-width:2}.green{fill:#f1fbf4;stroke:#35a853;stroke-width:2}.orange{fill:#fff5eb;stroke:#ff9900;stroke-width:2}.purple{fill:#f7f2ff;stroke:#7a4de8;stroke-width:2}.dash{fill:none;stroke:#79a7d8;stroke-width:2;stroke-dasharray:7 6}.arrow{stroke:#0b1f3a;stroke-width:3;fill:none;marker-end:url(#arr)}</style>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0b1f3a"/></marker>
</defs>
<text class="t h" x="600" y="62" text-anchor="middle" font-size="42">Control Plane vs Data Plane</text>
<rect class="box" x="30" y="110" rx="8" width="420" height="590"/><rect x="30" y="110" width="80" height="62" fill="#152844"/><text x="70" y="151" text-anchor="middle" font-size="30" font-weight="700" fill="white">aws</text><text class="t h" x="132" y="145" font-size="26">AWS-managed</text><text class="t s" x="132" y="174">(EKS control plane)</text>
<rect class="dash" x="70" y="210" width="340" height="410" rx="8"/><rect x="105" y="255" width="88" height="88" rx="8" fill="#ff9900"/><text x="149" y="312" text-anchor="middle" font-size="36" font-weight="700" fill="white">EKS</text><text class="t h" x="220" y="282" font-size="24">EKS Control Plane</text><text class="t s" x="220" y="313">(Multi-AZ)</text>
<rect class="blue" x="95" y="385" width="130" height="95" rx="7"/><text class="t h s" x="160" y="420" text-anchor="middle">API Server</text><text x="160" y="454" text-anchor="middle" font-size="28" fill="#2f6fed">☸</text><rect class="blue" x="250" y="385" width="130" height="95" rx="7"/><text class="t h s" x="315" y="420" text-anchor="middle">etcd</text><text x="315" y="455" text-anchor="middle" font-size="32" fill="#2f6fed">◉</text><rect class="blue" x="95" y="505" width="130" height="95" rx="7"/><text class="t h sm" x="160" y="540" text-anchor="middle">Scheduler</text><text x="160" y="575" text-anchor="middle" font-size="30" fill="#2f6fed">◷</text><rect class="blue" x="250" y="505" width="130" height="95" rx="7"/><text class="t h sm" x="315" y="535" text-anchor="middle">Controller</text><text class="t h sm" x="315" y="557" text-anchor="middle">Manager</text><text x="315" y="590" text-anchor="middle" font-size="28" fill="#2f6fed">⚙</text><text class="t sm" x="240" y="652" text-anchor="middle">Managed and highly available</text><text class="t sm" x="240" y="675" text-anchor="middle">across multiple AZs</text><rect x="30" y="725" width="420" height="62" rx="10" fill="#eaf4ff" stroke="#5aa0f0" stroke-width="2"/><text x="240" y="766" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#1455a0">AWS manages the control plane</text>
<rect class="green" x="570" y="110" rx="8" width="600" height="590"/><rect x="570" y="110" width="80" height="62" fill="#152844"/><text x="610" y="151" text-anchor="middle" font-size="30" font-weight="700" fill="white">aws</text><text class="t h" x="675" y="145" font-size="26">Your AWS Account</text><text class="t s" x="675" y="174">(Data plane)</text><rect x="610" y="210" width="520" height="410" rx="8" fill="#fbfffc" stroke="#35a853" stroke-width="2"/><text x="640" y="245" font-family="Arial" font-size="26" font-weight="700" fill="#2d8a46">VPC</text>
<g><rect class="dash" x="635" y="275" width="145" height="300" rx="8"/><text class="t sm" x="708" y="303" text-anchor="middle">Availability Zone 1</text><rect class="green" x="650" y="325" width="115" height="220" rx="6"/><text x="708" y="355" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#2d8a46">Private subnet</text><rect x="675" y="390" width="65" height="65" rx="6" fill="#ff9900"/><text x="708" y="430" text-anchor="middle" font-size="25" font-weight="700" fill="white">EC2</text><text class="t h sm" x="708" y="480" text-anchor="middle">Worker node</text><text class="t xs" x="708" y="505" text-anchor="middle">Pods</text><rect class="dash" x="800" y="275" width="145" height="300" rx="8"/><text class="t sm" x="873" y="303" text-anchor="middle">Availability Zone 2</text><rect class="green" x="815" y="325" width="115" height="220" rx="6"/><text x="873" y="355" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#2d8a46">Private subnet</text><rect x="840" y="390" width="65" height="65" rx="6" fill="#ff9900"/><text x="873" y="430" text-anchor="middle" font-size="25" font-weight="700" fill="white">EC2</text><text class="t h sm" x="873" y="480" text-anchor="middle">Worker node</text><text class="t xs" x="873" y="505" text-anchor="middle">Pods</text><rect class="dash" x="965" y="275" width="145" height="300" rx="8"/><text class="t sm" x="1038" y="303" text-anchor="middle">Availability Zone 3</text><rect class="green" x="980" y="325" width="115" height="220" rx="6"/><text x="1038" y="355" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" fill="#2d8a46">Private subnet</text><rect x="1005" y="390" width="65" height="65" rx="6" fill="#ff9900"/><text x="1038" y="430" text-anchor="middle" font-size="25" font-weight="700" fill="white">EC2</text><text class="t h sm" x="1038" y="480" text-anchor="middle">Worker node</text><text class="t xs" x="1038" y="505" text-anchor="middle">Pods</text></g>
<path class="arrow" d="M450 410 H570"/><path class="arrow" d="M570 448 H450"/><text class="t h sm" x="510" y="390" text-anchor="middle">Kubernetes API</text><text class="t xs" x="510" y="412" text-anchor="middle">(HTTPS)</text><rect x="570" y="725" width="600" height="62" rx="10" fill="#eef9f0" stroke="#65b874" stroke-width="2"/><text x="870" y="766" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#176b31">You manage nodes and workloads</text></svg>